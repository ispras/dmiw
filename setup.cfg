[metadata]
name = dmiw
description =Deep Methods for Image Watermarking
author = Ivannikov Institute for System Programming of the RAS
url = https://gitlab.ispras.ru/watermarking/dmiw

[flake8]
inline-quotes = double
ignore = E203, W503

[mypy]
# mypy configurations: http://bit.ly/2zEl9WI
allow_redefinition = False
check_untyped_defs = True
disallow_any_explicit = True
disallow_any_generics = True
disallow_untyped_calls = True
disallow_untyped_defs = True
ignore_errors = False
ignore_missing_imports = True
implicit_reexport = False
local_partial_types = True
strict_optional = True
strict_equality = True
no_implicit_optional = True
warn_no_return = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
warn_unreachable = True

[options]
packages = find:
include_package_data = True
package_dir =
    =src
python_requires = >=3.10
install_requires =
    wheel
    torch
    torchvision
    pydantic
    pydantic_settings
    scipy
    einops
    omegaconf
    lpips
    scikit-image
    timm

[options.packages.find]
where=src

[options.extras_require]
dev =
    # These requirements are for development and testing only, not for production.
    pytest
    pytest-cov
    flake8
    flake8-commas 
    flake8-continuation 
    pep8-naming
    flake8-expression-complexity
    flake8-quotes
    black
    mypy

[options.entry_points]
console_scripts =
    dmiw = dmiw.__main__:main
